# ============================================================
# LiteraConnect — Docker Compose (Self-Hosted)
# Testado em: Docker 25+, Compose v2
# ============================================================

networks:
  db_network:
    name: db_network
    external: true
  proxy_network:
    name: proxy_network
    external: true

volumes:
  supabase_db_data:
  supabase_storage_data:
  redis_data:
  mongo_data:
  mongo_config:

    # Configuração global de logs para evitar estouro de disco
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ----------------------------------------------------------
  # SUPABASE — PostgreSQL
  # ----------------------------------------------------------
  supabase_db:
    image: supabase/postgres:15.8.1.049
    container_name: supabase_db
    restart: unless-stopped
    logging: *default-logging
    networks:
      - db_network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.50'
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXP:-3600}
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/zz-schema.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -h 127.0.0.1 -p 5432" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # SUPABASE — Kong (API Gateway)
  # ----------------------------------------------------------
  supabase_kong:
    image: kong:3.9.1
    container_name: supabase_kong
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - db_network
      - proxy_network
    ports:
      - "8010:8000"
      - "8443:8443"
    deploy:
      resources:
        limits:
          memory: 1048M
          cpus: '0.30'
    environment:
      KONG_NGINX_HTTP_LARGE_CLIENT_HEADER_BUFFERS: 4 64k
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    volumes:
      - ./supabase/kong.yml:/var/lib/kong/kong.yml:ro
    depends_on:
      supabase_db:
        condition: service_started
    healthcheck:
      test: [ "CMD", "kong", "health" ]
      interval: 15s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------
  # SUPABASE — GoTrue (Autenticação)
  # ----------------------------------------------------------
  supabase_auth:
    image: supabase/gotrue:v2.186.0
    container_name: supabase_auth
    restart: unless-stopped
    logging: *default-logging
    networks:
      - db_network
      - proxy_network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.20'
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@supabase_db:5432/${POSTGRES_DB:-postgres}?search_path=auth,public
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXP:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP:-true}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-false}
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOTRUE_EXTERNAL_GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOTRUE_EXTERNAL_GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI:-}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-465}
      GOTRUE_SMTP_USER: ${SMTP_USER:-resend}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE:-/auth/v1/verify}
      GOTRUE_RATE_LIMIT_HEADER: X-Forwarded-For
      GOTRUE_MAILER_EXTERNAL_HOSTS: "literaconnect.jpdev.uk"
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: /etc/gotrue/templates/confirmation.html
    volumes:
      - ./supabase/templates:/etc/gotrue/templates
    depends_on:
      supabase_db:
        condition: service_started
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------
  # SUPABASE — PostgREST (API REST automática do Postgres)
  # ----------------------------------------------------------
  supabase_rest:
    image: postgrest/postgrest:latest
    container_name: supabase_rest
    restart: unless-stopped
    logging: *default-logging
    networks:
      - db_network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.20'
    environment:
      PGRST_DB_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@supabase_db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,storage,graphql_public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXP:-3600}
    depends_on:
      supabase_db:
        condition: service_started

  # ----------------------------------------------------------
  # SUPABASE — Storage
  # ----------------------------------------------------------
  supabase_storage:
    image: supabase/storage-api:latest
    container_name: supabase_storage
    restart: unless-stopped
    logging: *default-logging
    networks:
      - db_network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.30'
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://supabase_rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@supabase_db:5432/${POSTGRES_DB:-postgres}
      FILE_SIZE_LIMIT: ${STORAGE_FILE_SIZE_LIMIT:-524288000}
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: ${TENANT_ID:-literaconnect}
      REGION: ${REGION:-local}
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET:-literaconnect}
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://supabase_imgproxy:5001
    volumes:
      - supabase_storage_data:/var/lib/storage
    depends_on:
      supabase_db:
        condition: service_started
      supabase_rest:
        condition: service_started
      supabase_imgproxy:
        condition: service_started

  # ----------------------------------------------------------
  # SUPABASE — Imgproxy
  # ----------------------------------------------------------
  supabase_imgproxy:
    image: darthsim/imgproxy:v3.8.0
    container_name: supabase_imgproxy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - db_network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: ${IMGPROXY_ENABLE_WEBP_DETECTION:-true}
    volumes:
      - supabase_storage_data:/var/lib/storage:ro
    healthcheck:
      test: [ "CMD", "imgproxy", "health" ]
      interval: 20s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------
  # SUPABASE — Realtime (WebSockets)
  # ----------------------------------------------------------
  supabase_realtime:
    image: supabase/realtime:latest
    container_name: supabase_realtime
    restart: unless-stopped
    logging: *default-logging
    networks:
      - db_network
      - proxy_network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.40'
    environment:
      PORT: 4000
      DB_HOST: supabase_db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-postgres}
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:-supabaserealtimesecret}
      API_JWT_SECRET: "KrVxFzry97YoLDW32nqbUFTZb1sm4VBPrCduC1roqULghckEOc7kP+c37oar3tUfaSb4pdXSE3sfksCVzQbDTQ=="
      METRICS_JWT_SECRET: "KrVxFzry97YoLDW32nqbUFTZb1sm4VBPrCduC1roqULghckEOc7kP+c37oar3tUfaSb4pdXSE3sfksCVzQbDTQ=="
      FLY_ALLOC_ID: fly123
      FLY_APP_NAME: realtime
      APP_NAME: realtime
      SECRET_KEY_BASE: ${REALTIME_SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      ENABLE_TAILSCALE: "false"
      DNS_NODES: "''"
    depends_on:
      supabase_db:
        condition: service_started

  # ----------------------------------------------------------
  # SUPABASE — Studio
  # ----------------------------------------------------------
  supabase_studio:
    image: supabase/studio:latest
    container_name: supabase_studio
    restart: unless-stopped
    logging: *default-logging
    networks:
      - db_network
      - proxy_network
    ports:
      - "3001:3000"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.30'
    environment:
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: http://supabase_meta:8080
      POSTGRES_HOST: supabase_db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION:-LiteraConnect}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT:-LiteraConnect}
      SUPABASE_URL: http://supabase_kong:8000
      SUPABASE_PUBLIC_URL: ${API_EXTERNAL_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      EDGE_FUNCTIONS_MANAGEMENT_FOLDER: /app
    depends_on:
      supabase_meta:
        condition: service_started
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/profile" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------
  # SUPABASE — pg-meta
  # ----------------------------------------------------------
  supabase_meta:
    image: supabase/postgres-meta:v0.86.0
    container_name: supabase_meta
    restart: unless-stopped
    logging: *default-logging
    networks:
      - db_network
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase_db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      supabase_db:
        condition: service_started

  # ----------------------------------------------------------
  # REDIS
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    logging: *default-logging
    networks:
      - db_network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.20'
    command: >
      redis-server --save 60 1 --save 300 10 --loglevel warning --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------
  # MONGODB
  # ----------------------------------------------------------
  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    logging: *default-logging
    networks:
      - db_network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.40'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: literaconnect
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ----------------------------------------------------------
  # MONGO EXPRESS
  # ----------------------------------------------------------
  mongo_express:
    image: mongo-express:1.0.2
    container_name: mongo_express
    restart: unless-stopped
    logging: *default-logging
    networks:
      - db_network
      - proxy_network
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH: "false"
      ME_CONFIG_BASICAUTH_ENABLED: "false"
    depends_on:
      mongo:
        condition: service_healthy

  # ----------------------------------------------------------
  # NEXT.JS — Aplicação LiteraConnect
  # ----------------------------------------------------------
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SUPABASE_STORAGE_HOSTNAME: ${NEXT_PUBLIC_SUPABASE_STORAGE_HOSTNAME}
        SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    container_name: nextjs
    restart: unless-stopped
    logging: *default-logging
    networks:
      - db_network
      - proxy_network
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '1.00'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_SUPABASE_STORAGE_HOSTNAME: ${NEXT_PUBLIC_SUPABASE_STORAGE_HOSTNAME}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      REDIS_URL: redis://redis:6379
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@mongo:27017/literaconnect?authSource=admin
      CRON_SECRET: ${CRON_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      INTERNAL_SECURITY_SECRET: ${INTERNAL_SECURITY_SECRET}
    depends_on:
      supabase_db:
        condition: service_started
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      supabase_kong:
        condition: service_started

  # ----------------------------------------------------------
  # OFELIA
  # ----------------------------------------------------------
  ofelia:
    image: mcuadros/ofelia:latest
    container_name: ofelia
    restart: unless-stopped
    logging: *default-logging
    networks:
      - db_network
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      - nextjs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: daemon --docker
    labels:
      ofelia.job-exec.consolidate-views.schedule: "@every 6h"
      ofelia.job-exec.consolidate-views.container: "nextjs"
      ofelia.job-exec.consolidate-views.command: >
        sh -c 'curl -s -X POST http://localhost:3000/api/cron/consolidate-views -H "Authorization: Bearer ${CRON_SECRET}" -H "Content-Type: application/json"'
