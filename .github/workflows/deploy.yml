name: CD — Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SSH (Cloudflare Tunnel)
    runs-on: ubuntu-latest

    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared jammy main' | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update && sudo apt-get install cloudflared -y

      - name: Setup SSH and Cloudflare Tunnel Config
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          # Se houver políticas de Cloudflare Access ativas, podemos passar as credenciais de Service Token
          # via --id e --secret se configuradas nos secrets. Caso contrário, conecta diretamente.
          CF_AUTH=""
          if [ ! -z "${{ secrets.CF_CLIENT_ID }}" ] && [ ! -z "${{ secrets.CF_CLIENT_SECRET }}" ]; then
            CF_AUTH="--id ${{ secrets.CF_CLIENT_ID }} --secret ${{ secrets.CF_CLIENT_SECRET }}"
          fi
          
          cat <<EOF > ~/.ssh/config
          Host production-server
            HostName ${{ secrets.HOST }}
            User ${{ secrets.USERNAME }}
            IdentityFile ~/.ssh/id_ed25519
            ProxyCommand cloudflared access ssh --hostname %h $CF_AUTH
            StrictHostKeyChecking no
          EOF
          chmod 600 ~/.ssh/config

      - name: Run Deploy Commands via SSH Tunnel
        run: |
          ssh production-server << 'EOF'
            # ── Acesse o diretório do projeto no servidor ────────────────────
            cd /home/jpadmin/literaconnect

            # ── Atualiza o código-fonte a partir do repositório remoto ───────
            git pull origin main

            # ── Reconstrói as imagens e recria os contêineres afetados ───────
            docker compose up -d --build

            # ── Remove imagens órfãs para liberar espaço em disco ────────────
            docker image prune -f
          EOF
